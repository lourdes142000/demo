<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111820">
    <title>Terminal | Behind the Firewall</title>
    <link rel="stylesheet" href="styles.css">
    <script src="demo-events.js" defer></script>
    <script src="demo-terminal.js" defer></script>
  </head>
  <body class="terminal-page-body">
    <header class="terminal-header">
      <span>attacker@attacker.local:~</span>
      <nav class="terminal-header-links" aria-label="Other pages">
        <a href="demo-siem.html" target="_blank" rel="noopener">SIEM ↗</a>
        <a href="report.html" target="_blank" rel="noopener">Report ↗</a>
      </nav>
    </header>
    <main class="terminal-page">
      <section class="terminal-shell" aria-label="Interactive terminal">
        <pre id="terminal-output" class="terminal-output" aria-live="polite"></pre>
        <form id="terminal-form" class="terminal-input-row" autocomplete="off">
          <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true"></button>
          <label id="terminal-prompt" for="terminal-input">attacker@attacker.local:~$</label>
          <input id="terminal-input" type="text" aria-label="Terminal command" spellcheck="false" autocapitalize="off" autocomplete="off" autofocus>
        </form>
      </section>
    </main>
  </body>
</html>
